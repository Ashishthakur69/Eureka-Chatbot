<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Eureka AI Chatbot</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="loading">

    <div id="loader">

        <div class="spinner"></div>

        <p>
            Eureka is waking up... ✨
        </p>

    </div>


    <div class="app-container">

        <aside class="sidebar">

            <!-- Document upload -->

            <div class="sidebar-block file-upload-area">

                <div class="section-heading">

                    <h4>
                        Upload Document 📄
                    </h4>

                    <p>
                        Add a PDF or DOCX file
                    </p>

                </div>


                <div
                    id="upload-zone"
                    class="upload-zone"
                >

                    <i class="fas fa-file-arrow-up"></i>

                    <p class="upload-title">
                        Drag & drop your file
                    </p>

                    <p class="upload-subtitle">
                        or click to browse
                    </p>

                </div>


                <input
                    type="file"
                    id="file-input"
                    accept=".pdf,.docx"
                    multiple
                    hidden
                >

            </div>


            <!-- Uploaded documents -->

            <div class="sidebar-block file-list-area">

                <div class="documents-header">

                    <h4>
                        Uploaded Documents 📁
                    </h4>

                    <span
                        id="document-count"
                        class="document-count"
                    >
                        0 / 5
                    </span>

                </div>


                <div
                    id="file-list"
                    class="file-list"
                >

                    <p class="no-files">
                        📪 No documents uploaded yet.
                    </p>

                </div>

            </div>


            <!-- Theme -->

            <div class="sidebar-block theme-area">

                <div class="theme-label">

                    <i
                        id="theme-icon"
                        class="fas fa-sun"
                    ></i>

                    <span id="theme-text">
                        Light Mode
                    </span>

                </div>


                <label class="theme-switch">

                    <input
                        type="checkbox"
                        id="theme-toggle"
                    >

                    <span class="slider"></span>

                </label>

            </div>

        </aside>


        <!-- Main chat panel -->

        <main class="chat-panel">


            <!-- Chat header -->

            <header class="chat-header">

                <div>

                    <h1>
                        EUREKA! 💡
                    </h1>

                    <p class="chat-subtitle">
                        AI assistant with document intelligence
                    </p>

                </div>


                <div
                    id="chat-status"
                    class="chat-status"
                >

                    <span class="status-dot"></span>

                    <span>
                        Online
                    </span>

                </div>

            </header>


            <!-- Chat messages -->

            <div
                id="chat-box"
                class="chat-box"
            >
            </div>


            <!-- Input -->

            <div class="input-area">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask anything..."
                    autocomplete="off"
                >


                <button
                    id="send-btn"
                    type="button"
                    title="Send message"
                >

                    <i class="fas fa-paper-plane"></i>

                </button>

            </div>

        </main>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
